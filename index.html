<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vibecraft</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="fps"></div>
    <div id="cpu-panel"><canvas id="cpu" width="120" height="32"></canvas><span id="cpu-label"></span></div>
    <div id="hearts"></div>
    <div id="inventory"></div>
    <div id="weapon"></div>
    <div id="damage"></div>
    <div id="gameover" hidden>
      <h1>You died</h1>
      <button id="restart" type="button">Restart</button>
    </div>
    <div id="hud">WASD move · Space jump · 1/2 axe or gun · F or click to attack · skeletons bite back · walk over drops to pick up · drag mouse to look</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
